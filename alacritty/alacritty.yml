# ===================================================================
#  Arquivo de Configuração do Alacritty - Revisado e Otimizado
# ===================================================================

# --- Configurações Gerais ---
env:
  TERM: xterm-256color

# Define a largura de um caractere de tabulação.
tabspaces: 2

# --- Janela ---
window:
  # Espaçamento interno (padding) em pixels.
  padding:
    x: 6
    y: 6
  
  # Força um DPI específico. Útil em setups com múltiplos monitores.
  dpi:
    x: 96.0
    y: 96.0

  # Aumenta o padding para preencher a janela inteira.
  dynamic_padding: true

  # Opacidade do fundo (0.0 = transparente, 1.0 = opaco).
  opacity: 0.75

  # Decoração da janela (full = com barra de título e bordas).
  decorations: full

  # Título da janela.
  title: Alacritty

# --- Rolagem (Scrollback) ---
scrolling:
  history: 10000

# --- Fontes ---
# Alacritty encontrará as variações Bold e Italic da sua fonte principal.
font:
  normal:
    family: Hack
    style: Regular

  bold:
    family: Hack
    style: Bold

  italic:
    family: Hack
    style: Italic

  size: 9.0

  # Espaçamento extra entre os caracteres e linhas.
  offset:
    x: 0
    y: 1

# --- Cursor de Texto ---
# Aqui você controla o cursor que PISCA dentro do terminal.
cursor:
  # Estilo: Block, Underline, ou Beam
  style: Block
  # Habilita o piscar do cursor.
  blinking: On

# --- Esquemas de Cores ---
# Defina todos os seus temas favoritos aqui usando âncoras (&).
schemes:
  Catppuccin-Mocha: &Catppuccin-Mocha
    primary: { background: "#1E1E2E", foreground: "#CDD6F4" }
    cursor: { text: "#1E1E2E", cursor: "#F5E0DC" }
    normal: { black: "#45475A", red: "#F38BA8", green: "#A6E3A1", yellow: "#F9E2AF", blue: "#89B4FA", magenta: "#F5C2E7", cyan: "#94E2D5", white: "#BAC2DE" }
    bright: { black: "#585B70", red: "#F38BA8", green: "#A6E3A1", yellow: "#F9E2AF", blue: "#89B4FA", magenta: "#F5C2E7", cyan: "#94E2D5", white: "#A6ADC8" }

  DoomOne: &DoomOne
    primary: { background: '#282c34', foreground: '#bbc2cf' }
    cursor: { text: CellBackground, cursor: '#528bff' }
    normal: { black: '#1c1f24', red: '#ff6c6b', green: '#98be65', yellow: '#da8548', blue: '#51afef', magenta: '#c678dd', cyan: '#5699af', white: '#abb2bf' }
    bright: { black: '#5b6268', red: '#da8548', green: '#4db5bd', yellow: '#ecbe7b', blue: '#3071db', magenta: '#a9a1e1', cyan: '#46d9ff', white: '#dfdfdf' }

  Dracula: &Dracula
    primary: { background: '#282a36', foreground: '#f8f8f2' }
    cursor: { text: CellBackground, cursor: CellForeground }
    selection: { text: CellForeground, background: '#44475a' }
    normal: { black: '#000000', red: '#ff5555', green: '#50fa7b', yellow: '#f1fa8c', blue: '#bd93f9', magenta: '#ff79c6', cyan: '#8be9fd', white: '#bfbfbf' }
    bright: { black: '#4d4d4d', red: '#ff6e67', green: '#5af78e', yellow: '#f4f99d', blue: '#caa9fa', magenta: '#ff92d0', cyan: '#9aedfe', white: '#e6e6e6' }

  GruvboxDark: &GruvboxDark
    primary: { background: '#282828', foreground: '#ebdbb2' }
    normal: { black: '#282828', red: '#cc241d', green: '#98971a', yellow: '#d79921', blue: '#458588', magenta: '#b16286', cyan: '#689d6a', white: '#a89984' }
    bright: { black: '#928374', red: '#fb4934', green: '#b8bb26', yellow: '#fabd2f', blue: '#83a598', magenta: '#d3869b', cyan: '#8ec07c', white: '#ebdbb2' }

  Nord: &Nord
    primary: { background: '#2E3440', foreground: '#D8DEE9' }
    normal: { black: '#3B4252', red: '#BF616A', green: '#A3BE8C', yellow: '#EBCB8B', blue: '#81A1C1', magenta: '#B48EAD', cyan: '#88C0D0', white: '#E5E9F0' }
    bright: { black: '#4C566A', red: '#BF616A', green: '#A3BE8C', yellow: '#EBCB8B', blue: '#81A1C1', magenta: '#B48EAD', cyan: '#8FBCBB', white: '#ECEFF4' }
  
  # ... adicione aqui os outros temas que você tinha, se quiser ...
  # (MonokaiPro, OceanicNext, Palenight, Solarized, etc.)

# --- Seleção do Tema Ativo ---
# Use o apelido (*) para escolher um dos temas definidos acima.
# Para trocar, mude para *DoomOne, *Dracula, *Nord, etc.
colors: *Catppuccin-Mocha

# --- Mouse ---
mouse:
  # Esconde o ponteiro do mouse enquanto digita.
  hide_when_typing: true

# --- Atalhos de Teclado ---
key_bindings:
  - { key: V,        mods: Control|Shift, action: Paste }
  - { key: C,        mods: Control|Shift, action: Copy }
  - { key: Equals,   mods: Control,       action: IncreaseFontSize }
  - { key: Plus,     mods: Control,       action: IncreaseFontSize }
  - { key: Minus,    mods: Control,       action: DecreaseFontSize }
  - { key: Key0,     mods: Control,       action: ResetFontSize }
  - { key: F11,      mods: None,          action: ToggleFullscreen }
  - { key: L,        mods: Control,       chars: "\f" }
