background_opacity 0.8

############################################
# APARÊNCIA
############################################

# Fonte recomendada (ajuste se necessário)
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9 

# Melhor renderização
disable_ligatures never
adjust_line_height  110%
adjust_column_width 0

# Padding confortável
window_padding_width 8

############################################
# TRANSPARÊNCIA (equilíbrio entre estética e legibilidade)
############################################

background_opacity 0.75
dynamic_background_opacity yes

# Blur (funciona melhor em Wayland)
background_blur 8

############################################
# CORES (tema popular e equilibrado)
############################################

# Tokyo Night (muito usado pela comunidade)
include themes/tokyo-night.conf

############################################
# CURSOR
############################################

cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

############################################
# SCROLL
############################################

scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

############################################
# PERFORMANCE
############################################

enable_audio_bell no
visual_bell_duration 0.0
repaint_delay 10
input_delay 3
sync_to_monitor yes

############################################
# SELEÇÃO E COPY/PASTE
############################################

copy_on_select yes
strip_trailing_spaces smart
detect_urls yes

############################################
# SPLITS NATIVOS DO KITTY
############################################

map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+w     close_window

############################################
# ABAS
############################################

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol 🔔

############################################
# INTEGRAÇÃO COM TMUX (sessão persistente)
############################################

shell tmux 

############################################
# SEGURANÇA
############################################

allow_remote_control no

############################################
# CORES EQUILIBRADAS (suaves com presença)
############################################

# Preto
color0  #2e3440
color8  #4c566a

# Vermelho (mais vivo, mas não neon)
color1  #e06c75
color9  #ff7a84

# Verde (natural)
color2  #8fbc8f
color10 #a3be8c

# Amarelo (quente equilibrado)
color3  #ebcb8b
color11 #e5c07b

# Azul (presença sem exagero)
color4  #81a1c1
color12 #5e81ac

# Magenta
color5  #b48ead
color13 #c678dd

# Ciano
color6  #88c0d0
color14 #56b6c2

# Branco
color7     #d2d8e0
color15    #e2e8f0
#color7     #ffffff
#color15    #ffffff

# Fundo e texto
background #000000
foreground #d6d6d6

#foreground #c8d3f5
selection_background #3e4452
selection_foreground #ffffff

